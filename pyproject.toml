[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intern-assistant"
version = "1.2.0"
description = "实习管理与教学助手：RAG 制度问答 + Function Calling 智能体 + 票据硬闸门"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Intern Assistant Team" }]
keywords = ["rag", "llm-agent", "function-calling", "fastapi", "education"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

# ---- Ruff：lint + format 一体 ----
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort 导入排序
    "B",   # bugbear 常见陷阱
    "UP",  # pyupgrade 语法升级
]
ignore = [
    "E501",  # 行长由 formatter 管理，注释/中文提示允许超长
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

# ---- setuptools：src 布局 ----
[tool.setuptools.packages.find]
where = ["src"]
