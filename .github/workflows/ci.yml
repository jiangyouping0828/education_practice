name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 运行测试（票据硬闸门对抗用例）
        env:
          OPENAI_API_KEY: ""   # 测试不调用真实 LLM
        run: pytest tests/ -v

      - name: 语法检查
        run: python -m compileall src -q
