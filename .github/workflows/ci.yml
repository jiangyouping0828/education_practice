name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 ruff
        run: pip install ruff
      - name: ruff check（lint 规则见 pyproject.toml）
        run: ruff check src tests examples
      - name: ruff format --check（格式一致性）
        run: ruff format --check src tests examples

  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 运行全部测试（闸门对抗 / 身份隔离 / 规则边界，不调用真实 LLM）
        env:
          OPENAI_API_KEY: ""      # 测试环境禁用真实 LLM 调用
          IMS_DB_PATH: /tmp/ims_ci_${{ matrix.python-version }}.db
        run: pytest tests/ -v

      - name: 语法检查（保证 examples/scripts 也可导入）
        run: python -m compileall src examples scripts -q
